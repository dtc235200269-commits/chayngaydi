<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Quản lý ao - AquaSmart</title><link rel="stylesheet" href="styles.css?v=20261123-3">
</head>
<body data-page="ponds">
  <aside class="sidebar">
    <div class="brand"><div class="brand-mark">AS</div><div><strong>AquaSmart</strong><span>Farm Manager</span></div></div>
    <nav class="nav">
      <button class="nav-item" data-page="overview">Tổng quan</button>
      <button class="nav-item active" data-page="ponds">Quản lý ao</button>
      <button class="nav-item" data-page="monitor">Giám sát môi trường</button>
      <button class="nav-item" data-page="log">Nhật ký nuôi</button>
      <button class="nav-item" data-page="equipment">Thiết bị</button>
      <button class="nav-item" data-page="market">Quản lý tôm cá</button>
      <button class="nav-item" data-page="reports">Báo cáo</button>
    </nav>
    <div class="sidebar-bottom"><button class="nav-item" data-page="settings">Cài đặt</button><button class="nav-item" data-page="help">Trợ giúp</button><div class="profile"><div class="avatar">A</div><div class="profile-copy"><strong>Admin</strong><span>admin</span></div></div></div>
  </aside>
  <main class="main"><header class="topbar"><div class="search"><input type="search" placeholder="Tìm kiếm ao, thiết bị..." aria-label="Tìm kiếm"></div></header><section class="content"><div id="subPage" class="sub-page"></div></section></main>
  <div class="modal-backdrop" id="pondModal" aria-hidden="true"><div class="modal"><div class="modal-header"><h2 id="modalTitle">Thêm ao nuôi mới</h2><button class="modal-close" id="modalClose">×</button></div><form id="pondForm"><label>Tên ao<input name="name" required></label><div class="form-grid"><label>Diện tích (m²)<input name="area" type="number" min="1" required></label><label>Loài nuôi<select name="species"><option>Cá chép</option><option>Cá tra</option><option>Tôm sú</option><option>Tôm thẻ</option></select></label></div><div class="metric-form-grid"><label>Nhiệt độ (°C)<input name="temperature" type="number" min="0.1" step="0.1" required></label><label>pH<input name="ph" type="number" min="0.1" max="14" step="0.1" required></label><label>DO (mg/L)<input name="do" type="number" min="0.1" step="0.1" required></label></div><label>Ghi chú<textarea name="note"></textarea></label><div class="modal-actions"><button type="button" class="secondary-button" id="cancelModal">Hủy</button><button type="submit" class="primary-button">Lưu ao nuôi</button></div></form></div></div>
  <div class="toast" id="toast"></div><script src="auth.js?v=20261123-8"></script><script src="app.js?v=20261123-8"></script>
